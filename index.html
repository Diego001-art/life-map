<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бутри — легенды гор</title>
<link rel="stylesheet" href="src/ui/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<div id="loading">Загрузка села Бутри…</div>
<div id="menuBg" class="hidden"></div>
<div id="menu" class="hidden panel">
  <h1 id="mTitle"></h1>
  <div id="newHero"><label id="mNameLbl"></label><input id="mName" maxlength="20" autocomplete="off"></div>
  <button id="mStart"></button>
  <button id="mSettings"></button>
  <button id="mNew"></button>
</div>
<div id="settingsPanel" class="hidden panel">
  <h2 id="sTitle"></h2><h3 id="sIface"></h3><div id="sList"></div>
  <button id="sClose"></button>
</div>
<div id="heroPanel" class="hidden panel"><h2 id="hName"></h2><div id="hStats"></div></div>
<div id="hud">
  <div id="hint"></div>
  <div id="houseInfo"></div>
  <div id="toast"></div>
  <div id="help"></div>
  <button id="langBtn"></button>
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="sector"></div>
  <div id="questTrack"></div>
</div>
<canvas id="bigmap" class="hidden" width="512" height="512"></canvas>
<div id="dialog" class="hidden"><div id="dlgText"></div><div id="dlgNext"></div></div>
<div id="journal" class="hidden"><h2 id="jTitle"></h2><div id="jList"></div></div>
<div id="inventory" class="hidden"><h2 id="invTitle"></h2><div id="invList"></div></div>
<script>
  // Если что-то сломалось — показать ошибку на экране загрузки, а не висеть молча.
  function showErr(m) { var l = document.getElementById('loading'); if (l) l.innerHTML = 'Ошибка загрузки:<br><small>' + m + '</small><br><small>Пришлите скриншот Claude</small>'; }
  addEventListener('error', function (e) { showErr(e.message || e.target && e.target.src || 'файл не загрузился'); }, true);
  addEventListener('unhandledrejection', function (e) { showErr(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
  setTimeout(function () { if (document.getElementById('loading')) showErr('слишком долго (браузер не поддерживает игру или медленный интернет)'); }, 60000);
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
